services:
  postgres:
    image: postgres:16
    container_name: 42route_postgres
    restart: always
    environment:
      POSTGRES_USER: 42route
      POSTGRES_PASSWORD: 42route123
      POSTGRES_DB: 42route_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 42route -d 42route_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: 42route_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data: