# ============================================================
# 42Route API - Docker Compose de PRODUÇÃO (Temps / Servidor)
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 42route_api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      APP_URL: ${APP_URL:-https://routes.42luanda.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      QR_SECRET_KEY: ${QR_SECRET_KEY}
      QR_BOARDING_TTL_SECONDS: ${QR_BOARDING_TTL_SECONDS:-45}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      SWAGGER_USER: ${SWAGGER_USER:-Admin42}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
