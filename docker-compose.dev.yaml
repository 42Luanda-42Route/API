# Uso: cp .env.example .env && docker compose -f docker-compose.dev.yaml up
services:
  postgres:
    image: postgres:16-alpine
    container_name: 42route_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: 42route
      POSTGRES_PASSWORD: 42route123
      POSTGRES_DB: 42route_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    image: node:20-alpine
    container_name: 42route_api_dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://42route:42route123@postgres:5432/42route_db?sslmode=disable
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -c "apk add --no-cache openssl libc6-compat
      && npm ci
      && npx prisma generate
      && npx prisma migrate deploy
      && npm run start:dev"

volumes:
  postgres_data_dev:
  api_node_modules:
